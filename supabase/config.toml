# Supabase CLI config for the OmniForce hub project (excerpt).
project_id = "omniforce-hub"

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/reset-password"]
enable_signup = true

[auth.email]
enable_confirmations = true
otp_length = 6
otp_expiry = 600

# The sign-up email must contain {{ .Token }}: the hub asks for the 6-digit code.
[auth.email.template.confirmation]
subject = "Your Omni Force Vector verification code"
content_path = "./supabase/templates/confirm-signup.html"

[auth.email.template.recovery]
subject = "Reset your Omni Force Vector password"
content_path = "./supabase/templates/reset-password.html"

# Same Brevo account and sender as WSSO (WSSO's BREVO_SMTP_* / EMAIL_FROM).
# The SMTP key is never committed: set BREVO_SMTP_PASSWORD in your shell.
# On the hosted project, enter the same values in Authentication → Emails → SMTP Settings.
[auth.email.smtp]
enabled = true
host = "smtp-relay.brevo.com"
port = 587
user = "b06b82001@smtp-brevo.com"
pass = "env(BREVO_SMTP_PASSWORD)"
admin_email = "support@tlbisbig.world"
sender_name = "TLB Enterprise"

[functions.stripe-webhook]
verify_jwt = false
[functions.sso-jwks]
verify_jwt = false
[functions.sync-worker]
verify_jwt = false
[functions.directory-webhook]
verify_jwt = false
[functions.wsso-webhook]
verify_jwt = false
[functions.workforce-agent]
verify_jwt = false
[functions.mcp]
verify_jwt = false
[functions.oidc]
verify_jwt = false
[functions.integration-api]
verify_jwt = false
